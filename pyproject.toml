[project]
name = "plni"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Juan Antonio Pérez", email = "japerez@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "nbformat>=5.10.4",
    "pandas>=2.3.2",
    "plotnine>=0.15.0",
    "plotly>=6.9.0",
    "ipykernel>=7.3.0",
    "torch>=2.14.0",
]

[project.scripts]
plni = "plni:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
